<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Network Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0c0e13; --elev:#12151c; --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
      --text:#e7e9ee; --dim:#9ba3b2; --faint:#6b7382; --accent:#4f8cff; --red:#f0596c;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
    .box{background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:38px 36px;width:min(380px,92%);box-shadow:0 24px 70px rgba(0,0,0,.5)}
    .brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
    .brand h1{font-size:15px;font-weight:600}
    .brand .sub{font-size:11px;color:var(--faint);margin-top:1px}
    .f{margin-bottom:15px}
    .f label{display:block;font-size:12px;font-weight:500;color:var(--dim);margin-bottom:6px}
    .f input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border-strong);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;transition:.15s}
    .f input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
    .btn{width:100%;height:38px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;transition:filter .15s}
    .btn:hover{filter:brightness(1.1)}
    .btn:disabled{opacity:.5;cursor:default}
    .err{color:var(--red);font-size:12.5px;font-weight:500;margin-top:12px;display:none}
    .foot{margin-top:24px;font-size:11.5px;color:var(--faint);text-align:center}
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="rgba(79,140,255,.14)" stroke="rgba(79,140,255,.45)"/>
        <circle cx="16" cy="16" r="4" fill="#4f8cff"/>
        <circle cx="16" cy="16" r="8.5" fill="none" stroke="#4f8cff" stroke-width="1.2" opacity=".4"/>
        <circle cx="8" cy="8" r="2.2" fill="#3ecf8e"/>
        <circle cx="24" cy="8" r="2.2" fill="#3ecf8e"/>
        <circle cx="24" cy="24" r="2.2" fill="#f0596c"/>
        <circle cx="8" cy="24" r="2.2" fill="#3ecf8e"/>
      </svg>
      <div>
        <h1>Network Monitor</h1>
        <div class="sub">Network Operations</div>
      </div>
    </div>
    <form id="f">
      <div class="f"><label>Username</label><input id="u" autocomplete="username" required /></div>
      <div class="f"><label>Password</label><input id="p" type="password" autocomplete="current-password" required /></div>
      <button class="btn" type="submit">Sign in</button>
      <div class="err" id="e"></div>
    </form>
    <div class="foot">Secure access for authorized operators</div>
  </div>
  <script>
    // If already logged in, go straight to dashboard.
    fetch('/api/check-auth', {credentials: 'same-origin'}).then(r => r.json()).then(data => { if (data.authed) location.href = '/'; });
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = ev.target.querySelector('.btn');
      const err = document.getElementById('e');
      btn.disabled = true; err.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username: ***'u').value, password: ***'p').value})
        });
        if (res.ok) {
          location.href = '/';
        } else {
          err.textContent = 'Invalid username or password.';
          err.style.display = 'block';
        }
      } catch(ex) {
        err.textContent = 'Connection error — please try again.';
        err.style.display = 'block';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
