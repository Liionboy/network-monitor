<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access // Network Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg0:#04060c; --cyan:#00e5ff; --green:#25ff8a; --red:#ff3b5e;
      --text:#d9e6f7; --muted:#66809f; --line:rgba(0,229,255,.16); --line-soft:rgba(130,170,230,.10);
      --disp:'Orbitron',sans-serif; --body:'Rajdhani','Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--body);background:var(--bg0);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:
        linear-gradient(rgba(0,229,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,229,255,.045) 1px,transparent 1px),
        radial-gradient(ellipse at 50% -15%,rgba(0,229,255,.10),transparent 55%);
      background-size:46px 46px,46px 46px,100% 100%}
    body::after{content:'';position:fixed;left:0;right:0;top:-70%;height:240%;z-index:3;pointer-events:none;
      background:linear-gradient(to bottom,transparent 49.2%,rgba(0,229,255,.05) 50%,transparent 50.8%);
      background-size:100% 220px;animation:sweep 10s linear infinite}
    @keyframes sweep{from{transform:translateY(-24%)}to{transform:translateY(24%)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinBack{to{transform:rotate(-360deg)}}
    .ring-a{animation:spin 14s linear infinite;transform-origin:32px 32px}
    .ring-b{animation:spinBack 9s linear infinite;transform-origin:32px 32px}

    .box{position:relative;z-index:2;background:rgba(8,13,24,.92);border:1px solid var(--line);border-radius:4px;padding:44px 40px;width:min(400px,92%);text-align:center;box-shadow:0 0 14px rgba(0,229,255,.18),0 30px 70px rgba(0,0,0,.6)}
    .box::before{content:'';position:absolute;top:-1px;left:-1px;width:16px;height:16px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
    .box::after{content:'';position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}
    .box svg{margin-bottom:10px;filter:drop-shadow(0 0 8px rgba(0,229,255,.5))}
    .box h1{font-family:var(--disp);font-size:18px;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 12px rgba(0,229,255,.35)}
    .sub{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--cyan);opacity:.7;margin:6px 0 26px}
    .f{margin-bottom:16px;text-align:left}
    .f label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .f input{width:100%;background:rgba(4,6,12,.7);border:1px solid var(--line-soft);border-radius:4px;padding:12px;color:var(--text);font-family:var(--mono);font-size:15px;transition:.18s}
    .f input:focus{outline:none;border-color:rgba(0,229,255,.6);box-shadow:0 0 10px rgba(0,229,255,.2)}
    .btn{width:100%;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.55);color:var(--cyan);border-radius:4px;padding:12px;font-family:var(--body);font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:10px;transition:.18s;text-shadow:0 0 8px rgba(0,229,255,.5)}
    .btn:hover{background:rgba(0,229,255,.2);box-shadow:0 0 12px rgba(0,229,255,.35)}
    .btn:disabled{opacity:.4;cursor:default;box-shadow:none}
    .err{color:var(--red);font-family:var(--mono);font-size:12px;margin-top:14px;display:none;text-shadow:0 0 8px rgba(255,59,94,.5)}
    .foot{margin-top:26px;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="box">
    <svg width="64" height="64" viewBox="0 0 64 64">
      <rect x="1" y="1" width="62" height="62" rx="10" fill="#0a0f1c" stroke="#00e5ff" stroke-opacity=".35"/>
      <g class="ring-a">
        <circle cx="32" cy="32" r="24" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6 5" opacity=".5"/>
      </g>
      <g class="ring-b">
        <circle cx="32" cy="32" r="17" fill="none" stroke="#ff2d95" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>
      </g>
      <circle cx="32" cy="32" r="5" fill="#00e5ff"/>
      <circle cx="16" cy="16" r="3" fill="#25ff8a"/>
      <circle cx="48" cy="16" r="3" fill="#25ff8a"/>
      <circle cx="48" cy="48" r="3" fill="#ff3b5e"/>
      <circle cx="16" cy="48" r="3" fill="#25ff8a"/>
      <line x1="16" y1="16" x2="32" y2="32" stroke="#00e5ff" stroke-width="1" opacity=".4"/>
      <line x1="48" y1="16" x2="32" y2="32" stroke="#00e5ff" stroke-width="1" opacity=".4"/>
      <line x1="48" y1="48" x2="32" y2="32" stroke="#00e5ff" stroke-width="1" opacity=".4"/>
      <line x1="16" y1="48" x2="32" y2="32" stroke="#00e5ff" stroke-width="1" opacity=".4"/>
    </svg>
    <h1>Network Monitor</h1>
    <div class="sub">// SECURE ACCESS TERMINAL</div>
    <form id="f">
      <div class="f"><label>Operator</label><input id="u" autocomplete="username" required /></div>
      <div class="f"><label>Passphrase</label><input id="p" type="password" autocomplete="current-password" required /></div>
      <button class="btn" type="submit">Authenticate</button>
      <div class="err" id="e"></div>
    </form>
    <div class="foot">NOC TELEMETRY GRID · TLS LINK REQUIRED</div>
  </div>
  <script>
    // If already logged in, go straight to dashboard.
    fetch('/api/check-auth', {credentials: 'same-origin'}).then(r => r.json()).then(data => { if (data.authed) location.href = '/'; });
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = ev.target.querySelector('.btn');
      const err = document.getElementById('e');
      btn.disabled = true; err.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})
        });
        if (res.ok) {
          location.href = '/';
        } else {
          err.textContent = '// ACCESS DENIED: invalid credentials';
          err.style.display = 'block';
        }
      } catch(ex) {
        err.textContent = '// LINK ERROR: uplink unreachable';
        err.style.display = 'block';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
