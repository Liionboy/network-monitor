<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Network Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#070910; --text:#eaeff7; --muted:#8b95a8;
      --border:rgba(255,255,255,.09); --border-soft:rgba(255,255,255,.06);
      --accent:#38bdf8; --red:#fb7185;
      --disp:'Space Grotesk','Inter',sans-serif; --body:'Inter','Rajdhani',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--body);background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;
      background:
        radial-gradient(700px 450px at 12% -8%,rgba(56,189,248,.10),transparent 60%),
        radial-gradient(800px 550px at 90% 112%,rgba(129,140,248,.10),transparent 60%),
        radial-gradient(600px 500px at 65% 35%,rgba(52,211,153,.05),transparent 65%)}

    .box{position:relative;z-index:2;background:rgba(255,255,255,.045);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-soft);border-radius:24px;padding:44px 42px;width:min(410px,92%);text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.5);animation:rise .35s ease}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .box svg{margin-bottom:14px}
    .box h1{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.3px}
    .sub{font-size:13px;color:var(--muted);margin:6px 0 30px}
    .f{margin-bottom:16px;text-align:left}
    .f label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:7px}
    .f input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-family:var(--body);font-size:15px;transition:.18s}
    .f input:focus{outline:none;border-color:rgba(56,189,248,.55);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
    .btn{width:100%;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;border:0;border-radius:999px;padding:13px;font-family:var(--body);font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;transition:.18s;box-shadow:0 4px 16px rgba(56,189,248,.25)}
    .btn:hover{box-shadow:0 6px 22px rgba(56,189,248,.38);transform:translateY(-1px)}
    .btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
    .err{color:var(--red);font-size:13px;font-weight:500;margin-top:14px;display:none}
    .foot{margin-top:28px;font-size:11.5px;color:var(--muted);letter-spacing:.2px}
  </style>
</head>
<body>
  <div class="box">
    <svg width="60" height="60" viewBox="0 0 32 32">
      <rect x="1" y="1" width="30" height="30" rx="9" fill="rgba(255,255,255,.06)" stroke="rgba(56,189,248,.4)"/>
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8"/>
      <circle cx="16" cy="16" r="9" fill="none" stroke="#38bdf8" stroke-width="1.3" opacity=".45"/>
      <circle cx="16" cy="16" r="13" fill="none" stroke="#818cf8" stroke-width="1" opacity=".3"/>
      <circle cx="8" cy="8" r="2.4" fill="#34d399"/>
      <circle cx="24" cy="8" r="2.4" fill="#34d399"/>
      <circle cx="24" cy="24" r="2.4" fill="#fb7185"/>
      <circle cx="8" cy="24" r="2.4" fill="#34d399"/>
      <line x1="8" y1="8" x2="16" y2="16" stroke="#38bdf8" stroke-width="1" opacity=".35"/>
      <line x1="24" y1="8" x2="16" y2="16" stroke="#38bdf8" stroke-width="1" opacity=".35"/>
      <line x1="24" y1="24" x2="16" y2="16" stroke="#38bdf8" stroke-width="1" opacity=".35"/>
      <line x1="8" y1="24" x2="16" y2="16" stroke="#38bdf8" stroke-width="1" opacity=".35"/>
    </svg>
    <h1>Network Monitor</h1>
    <p class="sub">Sign in to your dashboard</p>
    <form id="f">
      <div class="f"><label>Username</label><input id="u" autocomplete="username" required /></div>
      <div class="f"><label>Password</label><input id="p" type="password" autocomplete="current-password" required /></div>
      <button class="btn" type="submit">Sign in</button>
      <div class="err" id="e"></div>
    </form>
    <div class="foot">Secure access · your session is encrypted</div>
  </div>
  <script>
    // If already logged in, go straight to dashboard.
    fetch('/api/check-auth', {credentials: 'same-origin'}).then(r => r.json()).then(data => { if (data.authed) location.href = '/'; });
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = ev.target.querySelector('.btn');
      const err = document.getElementById('e');
      btn.disabled = true; err.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username: ***'u').value, password: ***'p').value})
        });
        if (res.ok) {
          location.href = '/';
        } else {
          err.textContent = 'Invalid username or password.';
          err.style.display = 'block';
        }
      } catch(ex) {
        err.textContent = 'Connection error — please try again.';
        err.style.display = 'block';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
